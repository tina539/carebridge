<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareBridge AI</title>
    <style>
    body {
        background-color: #dff3ea;
        background-image: url("{{ url_for('static', filename='background.jpg') }}");
        background-size: cover;
        background-position: left bottom;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        margin: 0;
        padding: 30px 40px;
        font-family: sans-serif;
        box-sizing: border-box;
    }

    /* 頂部左側主區塊 */
    .top-container {
        display: inline-flex;
        align-items: flex-start;
        gap: 32px;
    }

    /* 左側標題區 */
    .brand-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .brand-section h1 {
        margin: 0;
        font-size: 2.3rem;
        font-weight: 800;
        color: #000000;
    }

    .brand-section .sub-title {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: #000000;
    }

    /* 右側身分選擇區 */
    .role-section {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }

    /* 深藍色方形提示標籤 */
    .role-badge {
        background-color: #003366;
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: bold;
        padding: 4px 10px;
        border-radius: 4px;
        letter-spacing: 0.5px;
    }

    /* 身分按鈕群組 */
    .btn-group {
        display: flex;
        gap: 8px;
    }

    .btn-group a {
        background: #f8f9fa;
        border: 1px solid #767676;
        border-radius: 4px;
        padding: 6px 12px;
        text-decoration: none;
        color: #000000;
        font-size: 0.92rem;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }

    .btn-group a:hover {
        background: #e2e6ea;
    }
</style>

</head>


<body>
    <div class="top-container">
        <!-- 左邊：標題與副標題 -->
        <div class="brand-section">
            <h1>CareBridge</h1>
            <div class="sub-title">偏鄉智慧醫療平台</div>
        </div>

        <!-- 右邊：深藍色方塊提示 + 身分按鈕 -->
        <div class="role-section">
            <div class="role-badge">請選擇您的身分</div>
            <div class="btn-group">
                <a href="/doctor-login">🩺 我是醫生</a>
                <a href="/patient">💊 我是患者</a>
                <a href="/hospital-login">🏥 醫院平台</a>
            </div>
        </div>
    </div>
</body>

</html>

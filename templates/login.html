<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>CareBridge - 患者登入</title>
    <style>
        body {
            background: linear-gradient(120deg, #E1F3DF 0%, #D7EFE9 50%, #CFECEB 100%);
            font-family: sans-serif;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>患者登入</h1>

    <p>請輸入註冊時使用的手機號碼</p>

    <form action="/login" method="POST">

        <label>手機號碼：</label>
        <input type="tel" name="phone" required>

        <br><br>

        <button type="submit">
            登入
        </button>

    </form>

    <br>

    <button onclick="location.href='/register'">
    首次使用？前往註冊
</button>

</body>
</html>
